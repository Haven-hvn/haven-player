<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haven Player</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0f;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #root {
            height: 100vh;
            overflow: hidden;
        }
    </style>
    <script>
        // Polyfills for browser compatibility (needed for Electron apps running in browser context)
        if (typeof global === 'undefined') {
            window.global = window;
        }
        if (typeof globalThis === 'undefined') {
            window.globalThis = window;
        }
        if (typeof process === 'undefined') {
            window.process = { env: {} };
        }
        // Stub require for modules that try to use it
        if (typeof window.require === 'undefined') {
            window.require = function(module) {
                console.warn('require() called for module:', module);
                // Return common mocks
                const mocks = {
                    'electron': {
                        ipcRenderer: {
                            invoke: async () => null,
                            on: () => {},
                            once: () => {},
                            removeListener: () => {},
                            send: () => {},
                        },
                    },
                    'fs': {},
                    'path': {},
                    'os': {},
                    'child_process': {},
                    'crypto': window.crypto,
                };
                return mocks[module] || {};
            };
        }
        // Electron IPC mock for browser testing
        if (typeof window.electronAPI === 'undefined') {
            window.electronAPI = {
                selectVideo: async () => null,
                readVideoFile: async () => null,
                uploadToFilecoin: async () => null,
                getFilecoinConfig: async () => null,
                saveFilecoinConfig: async () => null,
                getArkivConfig: async () => null,
                saveArkivConfig: async () => null,
                validateEvmConfig: async () => null,
                checkEvmBalance: async () => null,
                addMagnetUrl: async () => null,
                startBackend: async () => null,
                stopBackend: async () => null,
                restartBackend: async () => null,
                getUploadWorkerStatus: async () => null,
                startUploadWorker: async () => null,
                stopUploadWorker: async () => null,
                decryptTextWithLit: async () => null,
                playback: {
                    fileExists: async () => false,
                    getGatewayConfig: async () => ({ baseUrl: 'https://ipfs.io/ipfs/' }),
                    setGatewayConfig: async () => ({ baseUrl: 'https://ipfs.io/ipfs/' }),
                },
                onUploadProgress: () => {},
                onFilecoinUploadProgress: () => {},
            };
        }
    </script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
